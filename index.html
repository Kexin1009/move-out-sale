<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Move Out Sale</title>
<meta name="description" content="Moving out: furniture for sale.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a showroom grid of furniture, each piece wearing a round neon yard-sale price sticker; seller tools in a bottom bar */
:root{
  --bg:#F1F2EE; --paper:#FFFFFF; --ink:#1B2030; --muted:#5B6271; --line:#D9DCD4;
  --sticker:#FF5B1F; --sticker-ink:#1B1205; --tape:#FFD23F; --tape-ink:#2A2100;
  --sold:#D3263A; --ok:#1F8A4C; --chip:#E7E9E3; --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161B; --paper:#1D2027; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2F333C;
  --sticker:#FF6A33; --sticker-ink:#1B1205; --tape:#F2C230; --tape-ink:#231B00;
  --sold:#FF5468; --ok:#4CC27E; --chip:#272B33; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161B; --paper:#1D2027; --ink:#ECEEF2; --muted:#9BA2AF; --line:#2F333C;
  --sticker:#FF6A33; --sticker-ink:#1B1205; --tape:#F2C230; --tape-ink:#231B00;
  --sold:#FF5468; --ok:#4CC27E; --chip:#272B33; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sticker);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tape{background:var(--tape);color:var(--tape-ink);overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;padding-block:7px;transform:rotate(-1deg);margin:0 -10px}
.tape span{display:inline-block;animation:slide 40s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tape span{animation:none}}
header.hero{padding-block:36px 24px}
.hero-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(42px,8vw,88px);line-height:.95;letter-spacing:-.03em;margin:0;text-wrap:balance}
.hero .intro{max-width:60ch;color:var(--muted);margin:14px 0 0;font-size:16px;white-space:pre-line}
.deadline{flex:none;width:132px;height:132px;border-radius:50%;background:var(--sticker);color:var(--sticker-ink);display:grid;place-content:center;text-align:center;transform:rotate(8deg);box-shadow:var(--shadow)}
.deadline b{display:block;font-family:var(--f-display);font-size:40px;line-height:1}
.deadline small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:18px 14px;border-top:2px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-left:5px}
.tools select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,calc(50% - 6px)),1fr));gap:18px 12px;padding-bottom:60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--chip);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px;opacity:.7}
.price{position:absolute;top:8px;right:8px;min-width:60px;height:60px;padding:0 6px;border-radius:50%;background:var(--sticker);color:var(--sticker-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;transform:rotate(-10deg);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.price.free{background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:800;font-size:16px}
.card.sold .photo img,.card.sold .ph{filter:grayscale(1);opacity:.5}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--sold);color:var(--sold);font-family:var(--f-display);font-weight:800;font-size:26px;padding:0 14px;border-radius:6px;letter-spacing:.08em;background:color-mix(in srgb,var(--paper) 70%,transparent)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .name{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:var(--chip);border-radius:4px;padding:1px 6px}
.tag.ex{background:var(--tape);color:var(--tape-ink);font-weight:700}
.orig{text-decoration:line-through;font-family:var(--f-mono)}
.edit-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:auto;padding-top:10px;align-items:center}
.edit-row input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:13px}
.edit-row .cur{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.edit-row button,.edit-row2 button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 8px;font-size:12px}
.edit-row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edit-row2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 16px;border:2px dashed var(--line);border-radius:12px}
.notice{background:var(--paper);border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:780px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .x{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:var(--paper);color:var(--ink);font-size:20px;line-height:1;box-shadow:var(--shadow)}
.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:680px){.detail{grid-template-columns:1fr}}
.gallery .main{aspect-ratio:1;max-width:100%;background:var(--chip);position:relative}
.gallery .main img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;border-radius:6px;overflow:hidden;width:56px;height:56px;flex:none;background:none}
.thumbs button[aria-current="true"]{border-color:var(--sticker)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:24px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.info h2{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;padding-right:30px;overflow-wrap:anywhere;text-wrap:balance}
.big-price{font-family:var(--f-mono);font-size:30px;font-weight:700;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.big-price .orig{font-size:15px;color:var(--muted);font-weight:500}
.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.specs dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:2px}
.specs dd{margin:0;overflow-wrap:anywhere}
.desc{white-space:pre-line;overflow-wrap:anywhere;margin:0}
.status-line{font-weight:700}
.status-line.sold{color:var(--sold)} .status-line.available{color:var(--ok)}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--sold);border:1px solid var(--sold)}
.form{padding:24px 20px;display:grid;gap:14px}
.form h2{font-family:var(--f-display);margin:0;font-size:24px}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.pics{display:flex;flex-wrap:wrap;gap:8px}
.pic{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;padding:0}
.pic .cv{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 0}
.addpic{position:relative;width:80px;height:80px;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
.addpic input{position:absolute;width:1px;height:1px;opacity:0}
.form-actions{display:flex;flex-wrap:wrap;gap:8px}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--sold);font-size:13px;margin:0}
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--bg);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.adminbar .in{max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.adminbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adminbar button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px}
.adminbar button.pub{background:var(--sticker);color:var(--sticker-ink);border-color:var(--sticker);font-weight:700}
.adminbar button:disabled{opacity:.45;cursor:default}
.adminbar .st{font-size:13px;opacity:.8}
body.has-admin .grid{padding-bottom:130px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:60;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
footer{color:var(--muted);font-size:12px;padding-block:0 30px;text-align:center}
footer a,footer button.link{color:var(--muted);background:none;border:none;padding:0;font-size:12px;text-decoration:underline;cursor:pointer}
.steps{margin:0;padding-left:20px;font-size:14px;display:grid;gap:4px}
.steps a{color:var(--ink)}
.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="loading">Loading furniture…</p></div></div>
<script src="app.js"></script>
</body>
</html>
