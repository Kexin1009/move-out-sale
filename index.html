<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Move Out Sale</title>
<meta name="description" content="Moving out: furniture for sale.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: an airy, light room — soft mint daylight, rounded photo cards like prints pinned to a wall, prices hand-written on little paper tags */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F8F5; --bg-2:#E9F2EE; --paper:#FFFFFF; --ink:#3A4743; --muted:#7C8B86; --line:#DCE7E2;
  --leaf:#7FB59A; --leaf-ink:#2F5E48; --leaf-soft:#E1F0E8;
  --sky:#DCEBF2; --blush:#F7E4DF; --blush-ink:#9A5B4E;
  --sold:#B4BEBA; --danger:#C26B5E;
  --shadow:0 1px 2px rgba(58,71,67,.04),0 10px 30px rgba(90,130,115,.10);
  --r:18px;
  --f-display:"Quicksand","Nunito Sans",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18201E; --bg-2:#1E2826; --paper:#222D2A; --ink:#E4ECE8; --muted:#94A59F; --line:#2F3D39;
  --leaf:#8CC5A8; --leaf-ink:#CDEBDB; --leaf-soft:#28403A;
  --sky:#23343C; --blush:#3A2D2A; --blush-ink:#E9B9AD;
  --sold:#5A6864; --danger:#E08D80;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18201E; --bg-2:#1E2826; --paper:#222D2A; --ink:#E4ECE8; --muted:#94A59F; --line:#2F3D39;
  --leaf:#8CC5A8; --leaf-ink:#CDEBDB; --leaf-soft:#28403A;
  --sky:#23343C; --blush:#3A2D2A; --blush-ink:#E9B9AD;
  --sold:#5A6864; --danger:#E08D80;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{background:linear-gradient(180deg,var(--bg-2),var(--bg));}
.hero .wrap{padding-block:56px 36px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between}
.hero-text{flex:1 1 280px;min-width:0}
@media (max-width:560px){.hero .wrap{padding-block:32px 28px;gap:12px}.art{order:-1;max-width:130px!important}}
.hello{font-family:var(--f-hand);font-size:24px;color:var(--leaf-ink);margin:0 0 2px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,6.4vw,64px);line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hero .intro{max-width:52ch;color:var(--muted);margin:14px 0 0;font-size:16px;white-space:pre-line}
.pill{display:inline-flex;align-items:center;margin-top:18px;background:var(--leaf-soft);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--leaf-ink)}
.pill .dot{width:22px;height:22px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;color:var(--leaf-ink);font-weight:700;font-size:12px}
.pill b{font-weight:700;color:var(--leaf-ink)}
.art{flex:0 1 200px;max-width:200px;width:100%}
.art svg{display:block;width:100%;height:auto}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:22px 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.chip .n{font-size:12px;opacity:.75;margin-left:6px}
.tools select{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);padding-block:4px 16px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,calc(50% - 8px)),1fr));gap:28px 16px;padding-bottom:72px}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(58,71,67,.05),0 16px 40px rgba(90,130,115,.16)}
@media (prefers-reduced-motion: reduce){.card,.chip{transition:none}.card:hover{transform:none}}
.photo{position:relative;aspect-ratio:1;max-width:100%;background:var(--bg-2);overflow:hidden;margin:8px 8px 0;border-radius:calc(var(--r) - 6px)}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
.card.sold .photo img,.card.sold .ph{filter:grayscale(.85) brightness(1.05);opacity:.55}
.stamp{position:absolute;inset:auto auto 12px 12px;background:var(--paper);color:var(--muted);font-weight:700;font-size:13px;line-height:1;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow)}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.price{flex:none;position:relative;font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1;color:var(--leaf-ink);background:var(--leaf-soft);padding:4px 10px 6px 16px;border-radius:4px 10px 10px 4px;transform:rotate(-3deg)}
.price::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--paper)}
.price.free{background:var(--blush);color:var(--blush-ink)}
.card.sold .price{background:transparent;color:var(--sold);text-decoration:line-through;transform:none;padding-left:0}
.card.sold .price::before{display:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{background:var(--bg-2);color:var(--muted);border-radius:999px;padding:1px 9px}
.tag.ex{background:var(--blush);color:var(--blush-ink);font-weight:700}
.orig{text-decoration:line-through}
.edit-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:auto;padding-top:10px;align-items:center}
.edit-row input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:14px}
.edit-row .cur{font-size:14px;color:var(--muted)}
.edit-row button,.edit-row2 button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 10px;font-size:13px;color:var(--muted)}
.edit-row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edit-row2 button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:64px 16px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--paper)}
.notice{background:var(--blush);color:var(--blush-ink);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,55,50,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border-radius:24px;width:100%;max-width:820px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(30,50,45,.25)}
.modal .x{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:none;background:var(--paper);color:var(--muted);font-size:20px;line-height:1;box-shadow:var(--shadow)}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:680px){.detail{grid-template-columns:1fr}}
.gallery{padding:12px}
.gallery .main{aspect-ratio:1;max-width:100%;background:var(--bg-2);border-radius:16px;overflow:hidden}
.gallery .main img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:8px;padding-top:10px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;width:58px;height:58px;flex:none;background:none;opacity:.7}
.thumbs button[aria-current="true"]{border-color:var(--leaf);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:28px 24px 24px 12px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:680px){.info{padding:8px 20px 24px}}
.info h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15;margin:0;padding-right:36px;overflow-wrap:anywhere;text-wrap:balance}
.big-price{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.big-price .now{font-family:var(--f-hand);font-weight:700;font-size:40px;line-height:1;color:var(--leaf-ink)}
.big-price .now.gone{color:var(--sold)}
.big-price .orig{font-size:14px;color:var(--muted)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;background:var(--bg);border-radius:12px;padding:12px 14px}
.specs:empty{display:none}
.specs dt{color:var(--muted)}
.specs dd{margin:0;overflow-wrap:anywhere;font-weight:600}
.desc{white-space:pre-line;overflow-wrap:anywhere;margin:0;color:var(--ink)}
.status-line{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.status-line::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status-line.sold{color:var(--sold)} .status-line.available{color:var(--leaf)}
.btn{border:none;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid currentColor}
.btn:disabled{opacity:.5;cursor:default}

/* forms */
.form{padding:28px 24px;display:grid;gap:16px}
.form h2{font-family:var(--f-display);margin:0;font-size:24px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
.field textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.pics{display:flex;flex-wrap:wrap;gap:10px}
.pic{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--sky)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(30,40,38,.6);color:#fff;font-size:13px;line-height:1;padding:0}
.pic .cv{position:absolute;left:0;right:0;bottom:0;border:none;background:rgba(30,40,38,.55);color:#fff;font-size:10.5px;padding:2px 0}
.addpic{position:relative;width:84px;height:84px;border:1.5px dashed var(--leaf);border-radius:14px;display:grid;place-items:center;color:var(--leaf-ink);background:var(--leaf-soft);font-size:12px;font-weight:700;text-align:center;cursor:pointer}
.addpic input{position:absolute;width:1px;height:1px;opacity:0}
.form-actions{display:flex;flex-wrap:wrap;gap:8px}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:13px;margin:0}
.steps{margin:0;padding-left:20px;font-size:14px;display:grid;gap:4px}
.steps a{color:var(--leaf-ink)}

/* seller bar */
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.adminbar .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.adminbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adminbar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.adminbar button[aria-pressed="true"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf-ink)}
.adminbar button.pub{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:700}
.adminbar button:disabled{opacity:.45;cursor:default}
.adminbar .st{font-size:13px;color:var(--muted)}
body.has-admin .grid{padding-bottom:140px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;z-index:60;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
footer{color:var(--muted);font-size:13px;padding-block:8px 36px;text-align:center}
footer .bye{font-family:var(--f-hand);font-size:22px;color:var(--leaf-ink);display:block;margin-bottom:4px}
footer button.link{color:var(--muted);background:none;border:none;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.loading{text-align:center;color:var(--muted);padding:80px 0}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="loading">Loading furniture…</p></div></div>
<script src="app.js"></script>
</body>
</html>
